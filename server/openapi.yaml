openapi: 3.0.3
info:
  title: BookLeaf Author Support & Communication Portal API
  version: 1.0.0
  description: |
    Production REST API for the BookLeaf author portal and admin portal.

    ### Interactive Testing in Swagger UI (Login -> Authorize Workflow)
    1. Scroll down to `POST /auth/login` under the **Auth** section.
    2. Click **Try it out** and execute with test credentials:
       - **Admin**: `{"email": "admin@bookleaf.com", "password": "Admin@1234"}`
       - **Author**: `{"email": "amrita.prabhu@email.com", "password": "Test@1234"}`
    3. Copy the returned `data.token` string.
    4. Click the **Authorize** button (top right of page with padlock icon).
    5. Paste the token into the value field (without `Bearer ` prefix; Swagger UI prepends it).
    6. Click **Authorize** then **Close**. All protected endpoints are now authorized for interactive testing!

    ### Conventions
    - All endpoints are mounted under `/api/v1`.
    - Everything except `GET /health` and `POST /auth/login` requires `Authorization: Bearer <jwt>`.
    - Every error uses the standard shape (`ErrorResponse`) and carries a `requestId` that is also sent in the `x-request-id` response header.
    - List endpoints are paginated with `?page=1&limit=20` (limit max 100) and return `{ data, meta }`.
    - Authors only ever see their own data. Another author's resource returns **404**, never 403.
    - Domain events are emitted in-process after every DB write and broadcast in real time over Socket.IO.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development
  - url: /api/v1
    description: Relative API root
tags:
  - name: Health
  - name: Auth
  - name: Books
  - name: Tickets
  - name: Admin

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health (public)
      description: Reports database connectivity and AI provider mode. Always HTTP 200; `status` is `degraded` when the database is unreachable.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
              example:
                status: ok
                uptimeSeconds: 42
                timestamp: '2026-10-26T10:00:00.000Z'
                checks:
                  database: connected
                  ai: { enabled: false, primary: gemini, secondary: null, mode: manual_fallback }
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password (public)
      description: |
        Email is trimmed and lower-cased. An unknown email and a wrong password return the **same**
        401 response (and take the same time), so accounts cannot be enumerated.
        Stricter rate limit than the rest of the API (10 attempts / 15 min / IP).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: priya.sharma@email.com
              password: Test@1234
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: { code: UNAUTHORIZED, message: Invalid email or password, requestId: 4f0c2c0e-9a52-4a38-9d0a-6f6a1d2f0b11 }
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user (plus author profile for authors)
      operationId: getMe
      responses:
        '200':
          description: The authenticated user. `author` is null for admins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                user:
                  id: user_auth001
                  email: amrita.prabhu@email.com
                  name: Amrita Prabhu
                  role: AUTHOR
                  authorId: AUTH001
                author:
                  id: AUTH001
                  name: Amrita Prabhu
                  email: amrita.prabhu@email.com
                  phone: '+91-98450-12345'
                  city: Bangalore
                  joinedDate: '2023-01-15T00:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /books:
    get:
      tags: [Books]
      summary: List books (paginated)
      description: |
        - **AUTHOR**: always the caller's own books. Any `authorId` parameter is ignored.
        - **ADMIN**: all books, optionally filtered by `authorId`.

        Default order: published books first (newest publication date first), then in-production books.
        An AUTHOR token without an author profile gets 403.
      operationId: listBooks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AuthorIdFilter'
      responses:
        '200':
          description: A page of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /books/summary:
    get:
      tags: [Books]
      summary: Royalty summary across ALL of an author's books
      description: |
        Aggregates the whole portfolio, not just one page of the list.
        - **AUTHOR**: the caller's own books (`authorId` ignored).
        - **ADMIN**: `authorId` is **required** (400 otherwise); unknown author is 404.

        `pendingBelowThreshold` is an author-level accumulation: true when
        `0 < totalPending < payoutThreshold` (INR 1,000).
      operationId: getBooksSummary
      parameters:
        - $ref: '#/components/parameters/AuthorIdFilter'
      responses:
        '200':
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{id}:
    get:
      tags: [Books]
      summary: Get one book
      description: |
        **AUTHOR** can only read their own books. Another author's book and a nonexistent id both
        return the same 404. **ADMIN** can read any book.
      operationId: getBook
      parameters:
        - name: id
          in: path
          required: true
          description: Book id, for example `BK001`.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]+$', maxLength: 50 }
          example: BK001
      responses:
        '200':
          description: The book
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets:
    post:
      tags: [Tickets]
      summary: Create a support ticket (AUTHOR only)
      description: |
        Returns **201** immediately; AI classification runs asynchronously afterward.
        An AUTHOR token without an author profile gets 403.
        Admins get 403. Per-user rate limit: 10 tickets per 10 minutes.
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
            example:
              bookId: BK001
              subject: Clarification on Q3 royalty payout calculation
              description: My author dashboard shows ₹45,500 total royalty earned but the bank credit received was ₹42,000. Could you please clarify if TDS or withholding was applied?
      responses:
        '201':
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorTicket'
              example:
                id: clxtkt10250001
                ticketNumber: 1025
                subject: Clarification on Q3 royalty payout calculation
                description: My author dashboard shows ₹45,500 total royalty earned but the bank credit received was ₹42,000. Could you please clarify if TDS or withholding was applied?
                status: OPEN
                bookId: BK001
                bookTitle: Silent Echoes
                authorId: AUTH001
                authorName: Amrita Prabhu
                createdAt: '2026-10-29T10:00:00.000Z'
                updatedAt: '2026-10-29T10:00:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: bookId does not belong to the calling author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags: [Tickets]
      summary: List tickets (paginated)
      description: |
        - **AUTHOR**: own tickets only. Filters: `status`, `q`, `sort=newest|oldest`.
        - **ADMIN**: all tickets. Extra filters: `category`, `priority`, `authorId`, `bookId`,
          `assignedTo` (`me|unassigned|<userId>`), `needsManualTriage`, `overdue`, `from`, `to`, `q`,
          `sort=urgency` (default) `|newest|oldest`.

        **Urgency sort** (DB-level): unresolved (OPEN/IN_PROGRESS) before resolved (RESOLVED/CLOSED),
        then CRITICAL > HIGH > MEDIUM > LOW, then oldest createdAt first. Implemented with a SQL
        `CASE` expression via `$queryRaw` on matching ids, then full rows fetched in one `IN` query.
      operationId: listTickets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        - name: category
          in: query
          description: Admin only.
          schema: { type: string, enum: [ROYALTY_PAYMENTS, ISBN_METADATA, PRINTING_QUALITY, DISTRIBUTION_AVAILABILITY, BOOK_STATUS_PRODUCTION, GENERAL_INQUIRY] }
        - name: priority
          in: query
          description: Admin only.
          schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        - name: authorId
          in: query
          description: Admin only.
          schema: { type: string }
        - name: bookId
          in: query
          description: Admin only.
          schema: { type: string }
        - name: assignedTo
          in: query
          description: 'Admin only. Values: `me`, `unassigned`, or a user id.'
          schema: { type: string }
        - name: needsManualTriage
          in: query
          description: Admin only.
          schema: { type: boolean }
        - name: overdue
          in: query
          description: 'Admin only. When true, returns unresolved tickets with no first response past their priority SLA limit.'
          schema: { type: boolean }
        - name: from
          in: query
          description: 'Admin only. YYYY-MM-DD lower bound on createdAt.'
          schema: { type: string, format: date }
        - name: to
          in: query
          description: 'Admin only. YYYY-MM-DD upper bound on createdAt (inclusive).'
          schema: { type: string, format: date }
        - name: q
          in: query
          description: 'Text search on subject, description, and ticket number (e.g. "BL-1003" or "1003").'
          schema: { type: string, maxLength: 200 }
        - name: sort
          in: query
          schema: { type: string, enum: [urgency, newest, oldest] }
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get one ticket
      description: |
        AUTHOR can only read their own tickets. Another author's ticket and a nonexistent id both
        return the same 404. ADMIN can read any ticket.

        The response schema differs by role: AUTHOR receives `AuthorTicket`; ADMIN receives `AdminTicket`
        (which is a superset).
      operationId: getTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: The ticket (author or admin shape depending on caller role)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthorTicket'
                  - $ref: '#/components/schemas/AdminTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/messages:
    get:
      tags: [Tickets]
      summary: Get messages for a ticket
      description: |
        Ordered oldest → newest. **INTERNAL_NOTE** rows are excluded at the repository query level
        for AUTHOR callers (not filtered afterwards). ADMIN_REPLY sender is shown as
        `"BookLeaf Support"` to authors; real name only for admins.
      operationId: getTicketMessages
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Tickets]
      summary: Author follow-up message
      description: |
        AUTHOR only, own ticket. Not allowed if status is CLOSED (409). If RESOLVED, reopens to OPEN.
        Emits `ticket.message.created` and (if reopened) `ticket.updated`.
      operationId: createTicketMessage
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
            example:
              body: Thank you for checking. I confirm that the bank statement has been reviewed and matches the credit amount.
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
              example:
                id: msg_clx001
                ticketId: clxtkt10250001
                senderId: user_auth001
                senderName: Amrita Prabhu
                senderRole: AUTHOR
                type: AUTHOR_MESSAGE
                body: Thank you for checking. I confirm that the bank statement has been reviewed and matches the credit amount.
                createdAt: '2026-10-29T10:15:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ticket is CLOSED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/tickets/{id}:
    patch:
      tags: [Admin]
      summary: Update ticket metadata or assignment
      description: |
        ADMIN only. Any subset of `{status, category, priority, assignedToId}`.
        Reject empty body. Setting same value is no-op.
        Category/priority change sets corresponding source to ADMIN.
        Overriding both category and priority clears needsManualTriage.
      operationId: patchTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTicketRequest'
            example:
              status: IN_PROGRESS
              priority: HIGH
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
              example:
                id: clxtkt10250001
                ticketNumber: 1025
                subject: Clarification on Q3 royalty payout calculation
                description: My author dashboard shows ₹45,500 total royalty earned but the bank credit received was ₹42,000. Could you please clarify if TDS or withholding was applied?
                status: IN_PROGRESS
                category: ROYALTY_PAYMENTS
                categorySource: AI
                priority: HIGH
                prioritySource: ADMIN
                aiStatus: DONE
                needsManualTriage: false
                assignedToId: usr_admin01
                assignedTo:
                  id: usr_admin01
                  name: BookLeaf Admin
                  email: admin@bookleaf.com
                bookId: BK001
                bookTitle: Silent Echoes
                authorId: AUTH001
                authorName: Amrita Prabhu
                authorEmail: amrita.prabhu@email.com
                authorPhone: '+91-98450-12345'
                authorCity: Bangalore
                createdAt: '2026-10-29T10:00:00.000Z'
                updatedAt: '2026-10-29T10:20:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/tickets/{id}/assign-me:
    post:
      tags: [Admin]
      summary: Assign ticket to calling admin
      description: |
        ADMIN only. Idempotent: if already assigned to caller, returns 200 without emitting event.
        Allows takeover from other admins without changing status.
      operationId: assignTicketToMe
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/tickets/{id}/notes:
    post:
      tags: [Admin]
      summary: Add internal note to ticket
      description: |
        ADMIN only. Creates an INTERNAL_NOTE message visible only to admins.
        Emits `ticket.note.created` (never `ticket.message.created`).
      operationId: createInternalNote
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
            example:
              body: Finance team confirmed batch payout transaction #TXN99281 settled on the 15th with standard 10% TDS withholding.
      responses:
        '201':
          description: Internal note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketMessage'
              example:
                id: msg_note001
                ticketId: clxtkt10250001
                senderId: usr_admin01
                senderName: BookLeaf Admin
                senderRole: ADMIN
                type: INTERNAL_NOTE
                body: Finance team confirmed batch payout transaction #TXN99281 settled on the 15th with standard 10% TDS withholding.
                createdAt: '2026-10-29T10:22:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/tickets/{id}/reply:
    post:
      tags: [Admin]
      summary: Reply to ticket as admin
      description: |
        ADMIN only. Sends an ADMIN_REPLY message. If firstResponseAt is null, sets it to now.
        If ticket is OPEN, moves to IN_PROGRESS. Replying to a CLOSED ticket returns 409.
        Optional draftId must belong to this ticket and marks aiAssisted=true.
      operationId: adminReplyTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReplyRequest'
            example:
              body: Dear Amrita, thank you for reaching out. The ₹3,500 difference corresponds to 10% TDS withheld as per standard tax guidelines. The Form 16A TDS certificate will be available in your portal next week.
              draftId: draft_clx101
      responses:
        '201':
          description: Reply sent and ticket updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminReplyResponse'
              example:
                message:
                  id: msg_reply001
                  ticketId: clxtkt10250001
                  senderId: usr_admin01
                  senderName: BookLeaf Support
                  senderRole: ADMIN
                  type: ADMIN_REPLY
                  body: Dear Amrita, thank you for reaching out. The ₹3,500 difference corresponds to 10% TDS withheld as per standard tax guidelines. The Form 16A TDS certificate will be available in your portal next week.
                  createdAt: '2026-10-29T10:30:00.000Z'
                ticket:
                  id: clxtkt10250001
                  status: IN_PROGRESS
                  updatedAt: '2026-10-29T10:30:00.000Z'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ticket is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/admins:
    get:
      tags: [Admin]
      summary: List all admin users
      description: ADMIN only. Returns id and name of all admin users for assignee dropdowns.
      operationId: listAdmins
      responses:
        '200':
          description: List of admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/stats:
    get:
      tags: [Admin]
      summary: Get queue metrics and ticket statistics
      description: |
        ADMIN only. Single response with counts computed in the database:
        byStatus, byPriority (unresolved only), unassigned, overdue, needsManualTriage, avgFirstResponseHours, total.
      operationId: getAdminStats
      responses:
        '200':
          description: Aggregate stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/tickets/{id}/draft:
    get:
      tags: [Admin]
      summary: Get or generate AI draft reply
      description: |
        ADMIN only. Returns a cached draft reply or generates a new one.
        If a new author message was received after the draft was generated, it is automatically regenerated.
        When AI is unavailable, returns 200 with status "unavailable" and canned manual templates.
      operationId: getTicketDraft
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Draft reply response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/tickets/{id}/draft/regenerate:
    post:
      tags: [Admin]
      summary: Force regenerate AI draft reply
      description: |
        ADMIN only. Bypasses cached drafts and forces generation of a fresh draft reply.
        Rate-limited to 6 calls per minute.
      operationId: regenerateTicketDraft
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Fresh draft response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many draft regenerations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/tickets/{id}/reclassify:
    post:
      tags: [Admin]
      summary: Re-run AI ticket classification
      description: |
        ADMIN only. Asynchronously triggers AI classification pipeline.
        Returns 202 Accepted with current ticket state. 409 if a classification is already in progress.
      operationId: reclassifyTicket
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '202':
          description: Reclassification accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Classification already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/ai/usage:
    get:
      tags: [Admin]
      summary: Get AI usage and performance metrics
      description: |
        ADMIN only. Aggregates call totals, token usage, latency, and success rates from AiCallLog.
      operationId: getAiUsage
      parameters:
        - name: days
          in: query
          description: Window in days to aggregate metrics (default 7).
          schema: { type: integer, minimum: 1, maximum: 365, default: 7 }
      responses:
        '200':
          description: AI metrics report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiUsageReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from `POST /auth/login`. Claims are `sub` (user id), `role` and `authorId`.

  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    AuthorIdFilter:
      name: authorId
      in: query
      description: Admin only. Ignored for authors.
      schema: { type: string, maxLength: 50 }
      example: AUTH007
    TicketId:
      name: id
      in: path
      required: true
      description: Ticket cuid, e.g. `seed-ticket-1001`.
      schema: { type: string, minLength: 1, maxLength: 64 }

  responses:
    ValidationError:
      description: Invalid request data (VALIDATION_ERROR)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request data
              details: [{ in: query, path: limit, message: 'Too big: expected number to be <=100' }]
              requestId: 4f0c2c0e-9a52-4a38-9d0a-6f6a1d2f0b11
    Unauthorized:
      description: Missing, malformed, expired or invalid token (UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: UNAUTHORIZED, message: Authentication required, requestId: 4f0c2c0e-9a52-4a38-9d0a-6f6a1d2f0b11 }
    Forbidden:
      description: Authenticated but not allowed (FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: FORBIDDEN, message: You do not have permission to perform this action, requestId: 4f0c2c0e-9a52-4a38-9d0a-6f6a1d2f0b11 }
    NotFound:
      description: Resource not found, or not visible to the caller (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: NOT_FOUND, message: Book not found, requestId: 4f0c2c0e-9a52-4a38-9d0a-6f6a1d2f0b11 }
    RateLimited:
      description: Too many requests (RATE_LIMITED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error: { code: RATE_LIMITED, message: 'Too many requests, please try again later', requestId: 4f0c2c0e-9a52-4a38-9d0a-6f6a1d2f0b11 }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, AI_UNAVAILABLE, INTERNAL_ERROR]
            message: { type: string }
            details:
              type: array
              description: Present for validation errors.
              items:
                type: object
                additionalProperties: true
            requestId:
              type: string
              description: Correlation id, also returned in the `x-request-id` header.

    HealthReport:
      type: object
      required: [status, uptimeSeconds, timestamp, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        uptimeSeconds: { type: integer }
        timestamp: { type: string, format: date-time }
        checks:
          type: object
          required: [database, ai]
          properties:
            database: { type: string, enum: [connected, unreachable] }
            ai:
              type: object
              required: [enabled, primary, secondary, mode, configuredProviders, circuitBreaker]
              properties:
                enabled: { type: boolean }
                primary: { type: string, enum: [gemini] }
                secondary: { type: string, nullable: true, enum: [groq] }
                mode: { type: string, enum: [ai, manual_fallback] }
                configuredProviders:
                  type: array
                  items: { type: string }
                circuitBreaker:
                  type: object
                  required: [state, consecutiveFailures]
                  properties:
                    state: { type: string, enum: [CLOSED, OPEN] }
                    consecutiveFailures: { type: integer }
                    resetAt: { type: string, format: date-time, nullable: true }

    Role:
      type: string
      enum: [AUTHOR, ADMIN]

    User:
      type: object
      required: [id, email, name, role, authorId]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        authorId: { type: string, nullable: true, description: Null for admins. }

    AuthorProfile:
      type: object
      required: [id, name, email, phone, city, joinedDate]
      properties:
        id: { type: string, example: AUTH001 }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        city: { type: string }
        joinedDate: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Signed JWT (HS256). }
        user: { $ref: '#/components/schemas/User' }

    MeResponse:
      type: object
      required: [user, author]
      properties:
        user: { $ref: '#/components/schemas/User' }
        author:
          allOf:
            - $ref: '#/components/schemas/AuthorProfile'
          nullable: true

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNext, hasPrev]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer, description: 0 when there are no rows. }
        hasNext: { type: boolean }
        hasPrev: { type: boolean }

    StageProgress:
      type: object
      required: [name, state]
      properties:
        name:
          type: string
          enum: [Manuscript Received, Editing, Cover Design, Typesetting, Proofreading, ISBN Assignment, Printing, Distribution Setup, Published & Live]
        state: { type: string, enum: [complete, current, upcoming] }

    ProductionStage:
      type: object
      required: [currentStage, currentStageIndex, stages]
      properties:
        currentStage:
          type: string
          nullable: true
          description: Null when the stored status is unknown (the raw `status` is still returned on the book).
        currentStageIndex: { type: integer, nullable: true, minimum: 0, maximum: 8 }
        stages:
          type: array
          minItems: 9
          maxItems: 9
          items: { $ref: '#/components/schemas/StageProgress' }

    PayoutWindows:
      type: object
      description: |
        Assumption: calendar quarters; a quarter's royalties are due quarter end + 45 days. Computed
        relative to the current date, never hardcoded.
      required: [lastQuarterEnd, lastQuarterPayoutDeadline, nextQuarterEnd, nextQuarterPayoutDeadline]
      properties:
        lastQuarterEnd: { type: string, format: date, description: Last day of the most recently completed quarter. }
        lastQuarterPayoutDeadline: { type: string, format: date }
        nextQuarterEnd: { type: string, format: date, description: Last day of the current quarter. }
        nextQuarterPayoutDeadline: { type: string, format: date }

    Book:
      type: object
      required:
        - id
        - authorId
        - title
        - isbn
        - genre
        - publicationDate
        - status
        - mrp
        - authorRoyaltyPerCopy
        - totalCopiesSold
        - totalRoyaltyEarned
        - royaltyPaid
        - royaltyPending
        - lastRoyaltyPayoutDate
        - printPartner
        - availableOn
        - isPublished
        - productionStage
        - neverPaid
        - belowPayoutThreshold
        - payoutWindows
      properties:
        id: { type: string, example: BK001 }
        authorId: { type: string, example: AUTH001 }
        title: { type: string }
        isbn: { type: string, description: 'Shown exactly as stored, including XXXX placeholders.', example: 978-93-5XXXX-01-1 }
        genre: { type: string }
        publicationDate: { type: string, format: date, nullable: true, description: Null while in production. }
        status: { type: string, example: Published & Live }
        mrp: { type: integer, nullable: true, description: INR. Null (not 0) while unpublished. }
        authorRoyaltyPerCopy: { type: integer, nullable: true, description: INR. Null while unpublished. }
        totalCopiesSold: { type: integer }
        totalRoyaltyEarned: { type: integer, nullable: true, description: INR. Null while unpublished. }
        royaltyPaid: { type: integer, nullable: true, description: INR. Null while unpublished. }
        royaltyPending: { type: integer, nullable: true, description: INR. Null while unpublished. }
        lastRoyaltyPayoutDate: { type: string, format: date, nullable: true, description: Null when never paid. }
        printPartner: { type: string, nullable: true }
        availableOn: { type: array, items: { type: string } }
        isPublished: { type: boolean }
        productionStage: { $ref: '#/components/schemas/ProductionStage' }
        neverPaid: { type: boolean, description: Published and royaltyPaid is 0. }
        belowPayoutThreshold: { type: boolean, description: 'Published and 0 < pending < 1000 (rolls over to the next quarter).' }
        payoutWindows: { $ref: '#/components/schemas/PayoutWindows' }

    BookListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Book' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    BooksSummary:
      type: object
      required: [totalEarned, totalPaid, totalPending, bookCount, publishedCount, inProductionCount, payoutThreshold, pendingBelowThreshold]
      properties:
        totalEarned: { type: integer, description: 'INR, across all books.' }
        totalPaid: { type: integer }
        totalPending: { type: integer }
        bookCount: { type: integer }
        publishedCount: { type: integer }
        inProductionCount: { type: integer }
        payoutThreshold: { type: integer, example: 1000 }
        pendingBelowThreshold: { type: boolean, description: 'Author-level: 0 < totalPending < payoutThreshold.' }

    # ------------------------------------------------------------------
    # Ticket schemas (Phase 5)
    # ------------------------------------------------------------------

    TicketStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]

    TicketCategory:
      type: string
      enum: [ROYALTY_PAYMENTS, ISBN_METADATA, PRINTING_QUALITY, DISTRIBUTION_AVAILABILITY, BOOK_STATUS_PRODUCTION, GENERAL_INQUIRY]

    Priority:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]

    FieldSource:
      type: string
      enum: [AI, FALLBACK, ADMIN]

    AiStatus:
      type: string
      enum: [PENDING, DONE, FAILED, SKIPPED]

    MessageType:
      type: string
      enum: [AUTHOR_MESSAGE, ADMIN_REPLY, INTERNAL_NOTE]

    AttachmentMeta:
      type: object
      description: File metadata only; actual bytes are never uploaded.
      required: [name, size, type]
      properties:
        name: { type: string, maxLength: 255 }
        size: { type: integer, description: 'File size in bytes, max 10 MB.' }
        type: { type: string, description: MIME type. }

    CreateTicketRequest:
      type: object
      required: [subject, description]
      properties:
        bookId:
          type: string
          nullable: true
          description: 'Book id linked to this ticket, or null for General/Account Level queries.'
        subject:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 20
          maxLength: 5000
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AttachmentMeta'

    CreateMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }

    AuthorTicket:
      type: object
      description: Ticket as seen by an AUTHOR. Never contains admin-only fields.
      required: [id, ticketNumber, ticketNumberRaw, subject, description, status, book, attachments, createdAt, updatedAt]
      properties:
        id: { type: string }
        ticketNumber: { type: string, example: 'BL-1001', description: 'Human-readable display format.' }
        ticketNumberRaw: { type: integer, example: 1001 }
        subject: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        book:
          nullable: true
          description: Linked book summary, or null for General/Account Level tickets.
          allOf:
            - type: object
              required: [id, title]
              properties:
                id: { type: string }
                title: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/AttachmentMeta' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AdminTicket:
      description: Ticket as seen by an ADMIN. Superset of AuthorTicket.
      allOf:
        - $ref: '#/components/schemas/AuthorTicket'
        - type: object
          required:
            - author
            - category
            - categorySource
            - priority
            - prioritySource
            - aiStatus
            - aiReasoning
            - aiError
            - needsManualTriage
            - assignedTo
            - firstResponseAt
            - resolvedAt
            - ageHours
            - isOverdue
            - messageCount
          properties:
            author:
              type: object
              required: [id, name, email]
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: string, format: email }
            category:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/TicketCategory'
            categorySource:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/FieldSource'
            priority: { $ref: '#/components/schemas/Priority' }
            prioritySource:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/FieldSource'
            aiStatus: { $ref: '#/components/schemas/AiStatus' }
            aiReasoning: { type: string, nullable: true }
            aiError: { type: string, nullable: true }
            needsManualTriage: { type: boolean }
            assignedToId:
              type: string
              nullable: true
              description: Assigned admin user id, or null if unassigned.
            assignedTo:
              nullable: true
              description: Assigned admin user, or null if unassigned.
              allOf:
                - type: object
                  required: [id, name]
                  properties:
                    id: { type: string }
                    name: { type: string }
            firstResponseAt: { type: string, format: date-time, nullable: true }
            resolvedAt: { type: string, format: date-time, nullable: true }
            ageHours: { type: number, description: 'Hours since ticket creation, rounded to 1 decimal.' }
            isOverdue: { type: boolean, description: 'True when OPEN/IN_PROGRESS with no first response and age > SLA limit.' }
            messageCount: { type: integer }

    TicketMessage:
      type: object
      required: [id, ticketId, type, body, aiAssisted, createdAt, sender]
      properties:
        id: { type: string }
        ticketId: { type: string }
        type: { $ref: '#/components/schemas/MessageType' }
        body: { type: string }
        aiAssisted: { type: boolean }
        createdAt: { type: string, format: date-time }
        sender:
          type: object
          required: [id, displayName]
          properties:
            id: { type: string }
            displayName:
              type: string
              description: '"BookLeaf Support" for ADMIN_REPLY when shown to authors; real name otherwise.'

    TicketListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/AuthorTicket'
              - $ref: '#/components/schemas/AdminTicket'
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PatchTicketRequest:
      type: object
      description: At least one field required.
      properties:
        status:
          $ref: '#/components/schemas/TicketStatus'
        category:
          $ref: '#/components/schemas/TicketCategory'
        priority:
          $ref: '#/components/schemas/Priority'
        assignedToId:
          type: string
          nullable: true
          description: User ID of an ADMIN user, or null to unassign.

    CreateNoteRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000

    AdminReplyRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
        draftId:
          type: string
          description: Optional AI draft ID linked to this reply.

    AdminReplyResponse:
      type: object
      required: [message, ticket, editedFromDraft]
      properties:
        message:
          $ref: '#/components/schemas/TicketMessage'
        ticket:
          $ref: '#/components/schemas/AdminTicket'
        editedFromDraft:
          type: boolean
          description: True if the admin modified the AI draft body before sending.

    AdminUser:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    AdminStats:
      type: object
      required: [total, byStatus, byPriority, unassigned, overdue, needsManualTriage, avgFirstResponseHours]
      properties:
        total:
          type: integer
        byStatus:
          type: object
          required: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
          properties:
            OPEN: { type: integer }
            IN_PROGRESS: { type: integer }
            RESOLVED: { type: integer }
            CLOSED: { type: integer }
        byPriority:
          type: object
          required: [CRITICAL, HIGH, MEDIUM, LOW]
          properties:
            CRITICAL: { type: integer }
            HIGH: { type: integer }
            MEDIUM: { type: integer }
            LOW: { type: integer }
        unassigned:
          type: integer
        overdue:
          type: integer
        needsManualTriage:
          type: integer
        avgFirstResponseHours:
          type: number
          nullable: true

    AiUsageReport:
      type: object
      required: [windowDays, from, to, totals, draftMetrics, byKindAndProvider]
      properties:
        windowDays: { type: integer }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totals:
          type: object
          required: [calls, failures, successRate, inputTokens, outputTokens, averageLatencyMs]
          properties:
            calls: { type: integer }
            failures: { type: integer }
            successRate: { type: number }
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            averageLatencyMs: { type: integer }
        draftMetrics:
          type: object
          required: [draftsGenerated, repliesFromDrafts, editedReplies, editedPercentage]
          properties:
            draftsGenerated: { type: integer }
            repliesFromDrafts: { type: integer }
            editedReplies: { type: integer }
            editedPercentage: { type: integer }
        byKindAndProvider:
          type: array
          items:
            type: object
            required: [kind, provider, calls, failures, successRate, inputTokens, outputTokens, averageLatencyMs]
            properties:
              kind: { type: string }
              provider: { type: string }
              calls: { type: integer }
              failures: { type: integer }
              successRate: { type: number }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              averageLatencyMs: { type: integer }

    CannedSnippet:
      type: object
      required: [id, title, template]
      properties:
        id: { type: string }
        title: { type: string }
        template: { type: string }

    DraftDetail:
      type: object
      required: [id, ticketId, body, warnings, createdAt, provider, model, stale]
      properties:
        id: { type: string }
        ticketId: { type: string }
        category:
          $ref: '#/components/schemas/TicketCategory'
          nullable: true
        basedOnMessageId:
          type: string
          nullable: true
        body: { type: string }
        warnings:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        provider: { type: string }
        model: { type: string }
        stale: { type: boolean }

    DraftResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, unavailable, idle]
        draft:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DraftDetail'
        reason:
          type: string
        snippets:
          type: array
          items:
            $ref: '#/components/schemas/CannedSnippet'

